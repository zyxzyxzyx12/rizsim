}

function drawHUD(theme) {
  const g = G;
  const proc = g.proc;
  const base = proc.maxCombo > 0 ? g.comboPoints / proc.maxCombo : 0;
  const bonus = proc.maxRizHits > 0 ? (g.rizHits / proc.maxRizHits) * 0.2 : 0;
  // 实时 acc：官方机制，假设剩余所有音符全部 Perfect 的最佳可达达成率（满分 120% 起，bad/miss 后下降）
  const accDisp = RZ.bestAchievable(proc, {
    hits: g.hits, bad: g.bad, miss: g.miss, lostTail: g.lostTail,
    comboN: g.comboN, comboPoints: g.comboPoints, rizHits: g.rizHits, lostRiz: g.lostRiz,
  }) * 100;
  const hx0 = VIS.x0 + 10, hx1 = VIS.x1 - 10;
  const cx = (hx0 + hx1) / 2;
  const hudTop = 30;

  // 顶部中央：横置大血条（note 色边框 + 背景色内部，Riztime 跟随主题）
  const hpW = Math.min(300, (hx1 - hx0) * 0.56), hpH = 15;
  const hpX = cx - hpW / 2, hpY = hudTop - 12;
  ctx.fillStyle = 'rgba(' + (theme.note.r | 0) + ',' + (theme.note.g | 0) + ',' + (theme.note.b | 0) + ',0.85)';
  roundRect(hpX - 3, hpY - 3, hpW + 6, hpH + 6, 9); ctx.fill(); // note 色边框
  ctx.fillStyle = 'rgba(' + ((theme.bg.r * 0.30) | 0) + ',' + ((theme.bg.g * 0.30) | 0) + ',' + ((theme.bg.b * 0.30) | 0) + ',0.9)'; // 内部背景色（压暗）
  roundRect(hpX, hpY, hpW, hpH, 6); ctx.fill();
  const hpR = g.hp / 100;
  ctx.fillStyle = hpR > 0.5 ? 'rgb(110,220,160)' : hpR > 0.25 ? 'rgb(240,190,90)' : 'rgb(240,90,90)';
  roundRect(hpX, hpY, Math.max(2, hpW * hpR), hpH, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  roundRect(hpX + 2, hpY + 2, Math.max(1, hpW * hpR - 4), hpH / 3, 3); ctx.fill();

  // 左上：实时 acc（无模板，主题 note 色，从 120% 扣到 0%）
  ctx.font = '800 22px "Segoe UI",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillText(accDisp.toFixed(4) + '%', hx0 + 2, hudTop + 16);
  ctx.fillStyle = 'rgb(' + (theme.note.r | 0) + ',' + (theme.note.g | 0) + ',' + (theme.note.b | 0) + ')';
  ctx.fillText(accDisp.toFixed(4) + '%', hx0, hudTop + 14);

  // 右上：combo
  if (g.combo > 0) {
    const cAge = performance.now() - (g.comboAt || 0);
    const cs = cAge < 240 ? 1 + 0.24 * Math.sin(Math.min(1, cAge / 240) * Math.PI) : 1;
    ctx.save();
    ctx.translate(hx1 - 46, hudTop + 24);
    ctx.scale(cs, cs);
    ctx.translate(-(hx1 - 46), -(hudTop + 24));
    ctx.textAlign = 'center';
    ctx.font = '800 42px "Segoe UI",sans-serif';
    ctx.fillStyle = 'rgb(' + (theme.note.r | 0) + ',' + (theme.note.g | 0) + ',' + (theme.note.b | 0) + ')';
    ctx.fillText(String(g.combo), hx1 - 46, hudTop + 28);
    ctx.font = '700 11px "Segoe UI",sans-serif';
    ctx.fillStyle = 'rgba(' + (theme.note.r | 0) + ',' + (theme.note.g | 0) + ',' + (theme.note.b | 0) + ',0.6)';
    ctx.fillText('COMBO', hx1 - 46, hudTop + 46);
    ctx.restore();
  }

  // 曲名 / RIZTIME（血条下方中央）
  ctx.textAlign = 'center';
  ctx.font = '600 11px "Segoe UI",sans-serif';
  ctx.fillStyle = theme.riz ? 'rgba(255,214,94,0.9)' : 'rgba(255,255,255,0.5)';
  ctx.fillText(theme.riz ? 'RIZTIME' : (G.title || '').slice(0, 30), cx, hudTop + 42);

  // 暂停提示
  if (g.paused) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '700 16px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停', VW / 2, VH / 2 - 40);
  }
}
function drawGapMask(bg) {
  // 上下空隙（9:20 等长屏 contain 留白）：全屏坐标填与虚拟画布 mask 相同的背景色，
  // 避免 Riztime 半圆过渡/亚像素导致的色差缝
  const gapTop = cvOy * cvScale;
  const gapBot = cv.height - (cvOy * cvScale + VH * cvScale);
  if (gapTop <= 0.5 && gapBot <= 0.5) return;
  const col = 'rgb(' + (bg.r | 0) + ',' + (bg.g | 0) + ',' + (bg.b | 0) + ')';
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (gapTop > 0.5) {
    ctx.fillStyle = col;
    ctx.fillRect(0, 0, cv.width, Math.ceil(gapTop));
    const fade = 56 * cvScale;
    const g = ctx.createLinearGradient(0, gapTop, 0, gapTop + fade);
    for (let i = 0; i <= 10; i++) {
      const tt = i / 10;
      g.addColorStop(tt, 'rgba(' + (bg.r | 0) + ',' + (bg.g | 0) + ',' + (bg.b | 0) + ',' + (255 * (1 - tt) / 255).toFixed(3) + ')');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, Math.floor(gapTop), cv.width, Math.ceil(fade));
  }
  if (gapBot > 0.5) {
    const gy = cv.height - gapBot;
    ctx.fillStyle = col;
    ctx.fillRect(0, Math.floor(gy), cv.width, Math.ceil(gapBot));
    const fade = 56 * cvScale;
    const g = ctx.createLinearGradient(0, gy, 0, gy - fade);
    for (let i = 0; i <= 10; i++) {
      const tt = i / 10;
      g.addColorStop(tt, 'rgba(' + (bg.r | 0) + ',' + (bg.g | 0) + ',' + (bg.b | 0) + ',' + (255 * (1 - tt) / 255).toFixed(3) + ')');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, Math.floor(gy - fade), cv.width, Math.ceil(fade));
  }
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------------- 开始 / 结束 ---------------- */
function beginGame(proc, title) {
  G = null;
  startPlay(proc, {});
  G.title = title;
  show('game');
  resizeCanvas();
  lastTs = performance.now();
  // 音乐：有文件音乐则替换；无则保留已设置的演示音乐，否则用时钟
  A.ensure();
  if (bundle && bundle.musics.length && selIdx.music >= 0 && bundle.musics[selIdx.music]) {
    A.setFileMusic(bundle.musics[selIdx.music].blob);
  } else if (!A.music) {
    A.setClockMusic();
  }
  setTimeout(() => {
    if (curScreen !== 'game') return;
    const g = G;
    if (!g) return;
    g.playing = true;
    g.secNow = 0;
    if (A.music) A.playMusic();
  }, 120);
}

function pauseGame() {
  const g = G;
  if (!g || !g.playing || g.over || g.finished) return;
  g.paused = true;
  A.pauseMusic();
  $('pause-ov').classList.remove('hidden');
}
function resumeGame() {
  const g = G;
  if (!g) return;
  g.paused = false;
  if (g.playing && A.music) {
    A.seekMusic(Math.max(0, musicTime()));
    A.playMusic();
  }
  $('pause-ov').classList.add('hidden');
}

function finishPlay(completed) {
  const g = G;
  if (!g || g.finished) return;
  g.finished = true;
  g.playing = false;
  A.pauseMusic();
  showResult(completed);
}

function showResult(completed) {
  const g = G;
  const proc = g.proc;
  const base = proc.maxCombo > 0 ? g.comboPoints / proc.maxCombo : 0;
  const bonus = proc.maxRizHits > 0 ? (g.rizHits / proc.maxRizHits) * 0.2 : 0;
  const rate = base + bonus;
  const score = Math.round((proc.maxHits > 0 ? g.hits / proc.maxHits * 1000000 : 0)) + g.rizPerfect * 100;
  const maxScore = 1000000 + proc.maxRizHits * 100;
  const dots = Math.max(0, Math.floor(rate * 10 - 5));
  const allPerfect = g.miss === 0 && g.bad === 0 && g.early === 0 && g.late === 0 && g.hits === proc.maxHits;
  const rankEl = $('res-rank');
  if (allPerfect) { rankEl.textContent = 'ALL PERFECT'; rankEl.className = 'res-rank ap'; }
  else if (completed) { rankEl.textContent = 'CLEAR'; rankEl.className = 'res-rank clear'; }
  else { rankEl.textContent = 'FAILED'; rankEl.className = 'res-rank fail'; }
  $('res-rate').textContent = (rate * 100).toFixed(4) + '%'; // 官方实际达成率（与实时同源）
  $('res-score').textContent = score;
  $('res-maxscore').textContent = maxScore;
  $('res-combo').textContent = g.bestCombo;
  $('res-maxcombo').textContent = proc.maxCombo;
  $('res-perfect').textContent = g.perfect;
  $('res-early').textContent = g.early;
  $('res-late').textContent = g.late;
  $('res-bad').textContent = g.bad;
  $('res-miss').textContent = g.miss;
  $('res-hits').textContent = g.hits + ' / ' + proc.maxHits;

  show('result');
}

/* ---------------- 事件绑定 ---------------- */
function bindUI() {
  $('b-zip').onclick = () => $('f-zip').click();
  $('f-zip').onchange = e => { const f = e.target.files[0]; if (f) importZipFile(f); e.target.value = ''; };
  $('b-files').onclick = () => $('f-files').click();
  $('f-files').onchange = e => { if (e.target.files.length) importFilesList(e.target.files); e.target.value = ''; };
  $('b-sel-back').onclick = () => show('home');
  $('b-start').onclick = () => {
    const c = bundle.charts[selIdx.chart];
    if (!c) return;
    try {
      const proc = RZ.chartPreprocess(c.chart);
      beginGame(proc, bundle.title + ' · ' + c.name);
    } catch (err) {
      toast('谱面解析失败：' + err.message, true);
    }
  };
  $('b-save').onclick = async () => {
    if (!bundle) return;
    try {
      const rec = {
        id: 's' + Date.now() + Math.random().toString(36).slice(2, 6),
        title: bundle.title,
        charts: bundle.charts,
        music: bundle.musics[selIdx.music] ? bundle.musics[selIdx.music].blob : null,
        musicName: bundle.musics[selIdx.music] ? bundle.musics[selIdx.music].name : '',
        jacket: bundle.images[selIdx.cover] ? bundle.images[selIdx.cover].blob : null,
        jacketName: bundle.images[selIdx.cover] ? bundle.images[selIdx.cover].name : '',
        date: Date.now(),
      };
      await LIB.add(rec);
      toast('已保存到曲库');
      renderLib();
    } catch (e) {
      toast('保存失败：' + e.message, true);
    }
  };
  $('b-retry').onclick = () => {
    if (G) { resetPlayState(); show('game'); resizeCanvas(); G.playing = true; A.seekMusic(0); if (A.music) A.playMusic(); }
  };
  $('b-back-sel').onclick = () => openSelect();
  $('b-back-home').onclick = () => { A.stopMusic(); show('home'); };
  $('btn-pause').onclick = pauseGame;
  $('btn-fs').onclick = () => {
    const de = document.documentElement;
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (fsEl) {
        (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
      } else {
        (de.requestFullscreen || de.webkitRequestFullscreen || (() => toast('当前浏览器不支持全屏', true))).call(de);
      }
    } catch (e) { toast('全屏切换失败', true); }
  };
  $('b-resume').onclick = resumeGame;
  $('b-restart').onclick = () => {
    $('pause-ov').classList.add('hidden');
    if (G) { resetPlayState(); show('game'); resizeCanvas(); G.playing = true; A.seekMusic(0); if (A.music) A.playMusic(); }
  };
  $('b-quit').onclick = () => {
    $('pause-ov').classList.add('hidden');
    A.stopMusic();
    if (bundle) openSelect(); else show('home');
  };
  $('b-clear-lib').onclick = async () => {
    const all = await LIB.all();
    for (const r of all) await LIB.del(r.id);
    renderLib();
    toast('曲库已清空');
  };
  // 设置绑定
  const bindRange = (id, valId, key, fmt, onchange) => {
    const el = $(id);
    el.value = SET[key];
    // 数字可点击直接输入（回车/失焦提交，Esc 取消）
    const vb = $(valId);
    vb.style.cursor = 'pointer';
    vb.title = '点击输入数值';
    vb.onclick = () => {
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.step = el.step || 'any';
      inp.value = String(SET[key]);
      inp.style.width = '80px';
      inp.style.background = '#141a30';
      inp.style.color = '#fff';
      inp.style.border = '1px solid #7a6cff';
      inp.style.borderRadius = '6px';
      inp.style.padding = '2px 6px';
      inp.style.fontSize = '13px';
      inp.style.fontFamily = 'inherit';
      vb.replaceWith(inp);
      try { inp.focus(); inp.select(); } catch (e) {}
      let done = false;
      const commit = () => {
        if (done) return; done = true;
        const v = parseFloat(inp.value);
        if (isFinite(v)) {
          const mn = parseFloat(el.min || -Infinity), mx = parseFloat(el.max || Infinity);
          let cv = isFinite(mn) ? Math.max(mn, v) : v;
          if (isFinite(mx)) cv = Math.min(mx, cv);
          el.value = cv;
          upd();
        } else {
          vb.textContent = fmt(SET[key]);
        }
        inp.replaceWith(vb);
      };
      inp.onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        else if (e.key === 'Escape') { done = true; inp.replaceWith(vb); }
      };
      inp.onblur = commit;
    };
    const upd = () => {
      let v = parseFloat(el.value);
      const mn = parseFloat(el.min || -Infinity), mx = parseFloat(el.max || Infinity);
      if (isFinite(mn)) v = Math.max(mn, v);
      if (isFinite(mx)) v = Math.min(mx, v);
      SET[key] = v; $(valId).textContent = fmt(v); saveSet(); if (onchange) onchange(v);
    };
    el.oninput = upd; upd();
  };
  bindRange('s-flow', 'v-flow', 'flow', v => v.toFixed(2), v => { if (G) G.rt = RZ.chartRuntime(G.proc, v); });
  bindRange('s-judge', 'v-judge', 'judgeOff', v => v + 'ms', () => { if (G) G.jo = SET.judgeOff / 1000; });
  bindRange('s-musicoff', 'v-musicoff', 'musicOff', v => v + 'ms');
  bindRange('s-sfx', 'v-sfx', 'sfxVol', v => v.toFixed(2));
  bindRange('s-bgm', 'v-bgm', 'bgmVol', v => v.toFixed(2), v => A.setBgmVol(v));
  bindRange('s-flow2', 'v-flow2', 'flow', v => v.toFixed(2), v => { if (G) G.rt = RZ.chartRuntime(G.proc, v); });
  bindRange('s-judge2', 'v-judge2', 'judgeOff', v => v + 'ms', () => { if (G) G.jo = SET.judgeOff / 1000; });
  bindRange('s-musicoff2', 'v-musicoff2', 'musicOff', v => v + 'ms');
  $('c-line').checked = SET.showLine;
  $('c-line').onchange = e => { SET.showLine = e.target.checked; saveSet(); };
  $('c-points').checked = SET.showPoints;
  $('c-points').onchange = e => { SET.showPoints = e.target.checked; saveSet(); };
  $('c-auto').checked = SET.autoplay;
  $('c-auto').onchange = e => { SET.autoplay = e.target.checked; saveSet(); };
  $('c-auto2').checked = SET.autoplay;
  $('c-auto2').onchange = e => { SET.autoplay = e.target.checked; if (G) G.autoplay = e.target.checked; saveSet(); };
  // 键盘
  document.addEventListener('keydown', e => {
    if (curScreen !== 'game') return;
    if (e.code === 'Escape') {
      const ov = $('pause-ov');
      if (ov.classList.contains('hidden')) pauseGame(); else resumeGame();
    } else if (e.code === 'Space') {
      e.preventDefault();
      const ov = $('pause-ov');
      if (ov.classList.contains('hidden')) pauseGame(); else resumeGame();
    } else if (e.code === 'KeyR' && G && G.playing) {
      $('pause-ov').classList.add('hidden');
      resetPlayState();
      G.playing = true; A.seekMusic(0); if (A.music) A.playMusic();
    }
  });
  // 游戏时禁止右键/长按菜单
  document.addEventListener('contextmenu', e => { if (curScreen === 'game') e.preventDefault(); });
  // 页面隐藏自动暂停
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && curScreen === 'game' && G && G.playing && !G.paused) pauseGame();
  });
  bindInput(cv);
}

/* ---------------- 曲库渲染 ---------------- */
let libUrls = [];
function renderLib() {
  const box = $('lib-list');
  libUrls.forEach(u => URL.revokeObjectURL(u));
  libUrls = [];
  LIB.all().then(list => {
    if (!list.length) {
      box.innerHTML = '<div class="lib-empty">还没有保存的谱面。导入 ZIP 后点「保存到曲库」，下次打开页面还在。</div>';
      return;
    }
    box.innerHTML = '';
    list.sort((a, b) => b.date - a.date);
    for (const r of list) {
      const card = document.createElement('div');
      card.className = 'song-card';
      const imgHtml = r.jacket
        ? (() => { const u = URL.createObjectURL(r.jacket); libUrls.push(u); return '<img src="' + u + '" alt="">'; })()
        : '<div class="noimg">♫</div>';
      card.innerHTML = imgHtml +
        '<div class="sc-info"><div class="sc-name">' + esc(r.title) + '</div>' +
        '<div class="sc-sub">' + r.charts.length + ' 个难度 · ' + (r.musicName || '无音乐') + '</div></div>' +
        '<div class="sc-btns"><button class="btn small" data-act="play">▶</button><button class="btn small" data-act="del">✕</button></div>';
      card.querySelector('[data-act=play]').onclick = () => {
        bundle = { title: r.title, charts: r.charts, musics: r.music ? [{ name: r.musicName, blob: r.music }] : [], images: r.jacket ? [{ name: r.jacketName, blob: r.jacket }] : [] };
        selIdx = { chart: 0, music: 0, cover: 0 };
        openSelect();
      };
      card.querySelector('[data-act=del]').onclick = async e => {
        e.stopPropagation();
        await LIB.del(r.id);
        renderLib();
      };
      box.appendChild(card);
    }
  });
}

/* ---------------- 调试钩子 ---------------- */
window.__dbg = { getG: () => G, getA: () => A, getSet: () => SET };

/* ---------------- 启动 ---------------- */
(async function boot() {
  bindUI();
  await LIB.open();
  renderLib();
  requestAnimationFrame(loop);
})();

})();
</script>
